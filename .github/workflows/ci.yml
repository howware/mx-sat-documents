name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Private-data guard (every versioned file)
        shell: bash
        run: git ls-files -z | xargs -0 python tools/check_private_data.py
      - name: Lint
        run: uvx ruff@0.6.9 check src tests tools
      - name: Tests
        run: uv run --python ${{ matrix.python }} pytest -q
